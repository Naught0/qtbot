services:
  qtbot:
    platform: "linux/amd64"
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /qtbot
    env_file:
      - .env
    networks:
      - qtbot
    volumes:
      - .:/qtbot
    restart: always
  redis:
    image: redis
    restart: always
    networks:
      - qtbot
    ports:
      - "127.0.0.1:6379:6379"
networks:
  qtbot:
    name: qtbot-network
    driver: bridge
